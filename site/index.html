<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบกระจาย งปม.สอป. (ต้นแบบ v3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --asphalt:#172028; --panel:#1e2932; --panel2:#24313b; --line:#33424e; --text:#e9eef2; --mute:#93a3af; --faint:#5f707c;
  --paint:#f2c230; --sign:#4aa8ff; --crash:#ff6652; --r:6px;
  --t0:#4aa8ff; --t1:#6b6450; --t2:#f7e08a; --t3:#f2b62f; --t4:#ff7a1a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--asphalt);color:var(--text);font:14px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--paint);outline-offset:2px}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh}
header{display:flex;align-items:flex-end;gap:28px;padding:12px 18px 0;border-bottom:1px solid var(--line)}
.brand{padding-bottom:10px}
.brand b{display:block;font-size:17px;font-weight:700}
.brand span{color:var(--mute);font-size:12px}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:10px 16px 11px;color:var(--mute);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--paint)}
.proto{margin-left:auto;padding-bottom:12px;color:var(--faint);font-size:12px}
.proto a{color:var(--mute)}
.fbar{padding:10px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.fgrp{display:flex;align-items:center;gap:8px}
.fgrp>label{color:var(--mute);font-size:12px}
.years{display:flex;gap:2px;background:var(--panel);border-radius:var(--r);padding:2px}
.years button{border:0;background:none;padding:3px 9px;border-radius:4px;color:var(--mute)}
.years button.on{background:var(--paint);color:#1b1a12;font-weight:600}
.years button.in{background:#5a4c1f;color:var(--text)}
select{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:4px 8px;max-width:200px}
select option{background:var(--panel2)}
.seg{display:flex;background:var(--panel);border-radius:var(--r);padding:2px}
.seg button{border:0;background:none;padding:3px 11px;border-radius:4px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 -2px 0 var(--k,var(--paint))}
.seg small{color:var(--faint);margin-left:4px}
.more{position:relative}
.more>button{background:none;border:1px dashed var(--line);border-radius:var(--r);padding:4px 10px;color:var(--mute)}
.pop{position:absolute;z-index:1500;top:calc(100% + 6px);left:0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:12px;width:300px;box-shadow:0 8px 24px rgba(0,0,0,.35);display:grid;gap:10px}
.pop label,.field{display:grid;gap:3px;color:var(--mute);font-size:12px}
.pop select{max-width:none;width:100%}
.chips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:24px}
.chips .hint{color:var(--faint);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 4px 1px 10px;font-size:12.5px}
.chip button{border:0;background:none;color:var(--mute);width:20px;height:20px;border-radius:50%;line-height:1}
.chip button:hover{background:var(--line);color:var(--text)}
.clear{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:12px}
main{display:grid;grid-template-columns:320px 1fr var(--rw,440px);min-height:0}
main.wide{--rw:640px}
aside{overflow:auto;overflow-x:hidden;padding:14px 16px;min-height:0}
aside.left{border-right:1px solid var(--line)}
aside.right{border-left:1px solid var(--line)}
.mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#0f171e}
h2{font-size:15px;font-weight:600;margin:0 0 6px}
h3{font-size:13px;font-weight:600;margin:18px 0 8px}
.sub{color:var(--mute);font-size:12px}
.note{color:var(--faint);font-size:12px;margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--panel);padding:10px 12px}
.kpi b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.kpi span{color:var(--mute);font-size:12px}
.kpi.paint b{color:var(--paint)} .kpi.crash b{color:var(--crash)} .kpi.sign b{color:var(--sign)}
/* budget tier strip: the executive's first read */
.tierbar{display:flex;height:34px;border-radius:var(--r);overflow:hidden;margin:6px 0 8px;gap:2px}
.tierbar button{border:0;padding:0;min-width:3px;position:relative}
.tierbar button.dim{opacity:.3}
.tierlist{display:grid;gap:2px}
.tierlist button{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:4px 6px;border-radius:4px}
.tierlist button:hover{background:var(--panel)}
.tierlist button.sel{background:var(--panel2);box-shadow:inset 3px 0 0 var(--paint)}
.tierlist i{width:12px;height:12px;border-radius:2px;display:block}
.tierlist small{color:var(--mute)}
.tierlist .pc{color:var(--mute);font-size:12px;min-width:40px;text-align:right}
.vbars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:16px}
.vbars button{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;background:none;border:0;padding:0;color:var(--mute);font-size:11px}
.vbars i{display:block;width:100%;background:var(--paint);border-radius:3px 3px 0 0;min-height:2px;opacity:.35}
.vbars button.sel i{opacity:1}
.vbars em{font-style:normal;color:var(--text);font-size:10.5px}
.hbars{display:grid;gap:4px}
.hbars button{display:grid;grid-template-columns:96px 1fr 64px;gap:8px;align-items:center;background:none;border:0;padding:3px 4px;border-radius:4px;text-align:left}
.hbars button:hover{background:var(--panel)}
.hbars .bar{height:10px;background:var(--panel2);border-radius:2px;overflow:hidden}
.hbars .bar i{display:block;height:100%;background:var(--paint)}
.hbars .v{text-align:right;color:var(--mute);font-size:12px}
/* need × budget matrix */
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;grid-template-rows:auto 1fr 1fr auto;gap:4px;margin:8px 0}
.matrix .ax{color:var(--mute);font-size:11.5px;display:flex;align-items:center;justify-content:center}
.matrix .ay{writing-mode:vertical-rl;transform:rotate(180deg)}
.q{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:8px 10px;text-align:left;min-height:84px}
.q:hover{border-color:var(--mute)}
.q.sel{background:var(--panel2);border-color:var(--text)}
.q b{display:block;font-size:22px;font-weight:600;line-height:1.15}
.q span{display:block;font-size:12px;color:var(--mute)}
.q em{font-style:normal;font-size:12.5px;font-weight:600}
.q.gap{border-color:#b9473a}.q.gap em{color:#ff8a75}
.q.fit em{color:var(--paint)} .q.rev em{color:#c79bff} .q.low em{color:var(--mute)}
svg.sc{width:100%;height:auto;display:block;background:var(--panel);border-radius:var(--r)}
svg.sc text{fill:var(--faint);font-size:10px}
svg.sc circle{cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--mute);font-size:12px;padding:0;border-bottom:1px solid var(--line);position:sticky;top:-14px;background:var(--asphalt);white-space:nowrap;z-index:1}
th button{background:none;border:0;color:inherit;padding:6px;width:100%;text-align:inherit;font-size:12px;display:flex;gap:4px;align-items:center}
th.n button{justify-content:flex-end}
th button:hover{color:var(--text)}
th button[aria-sort]{color:var(--paint)}
th .ar{font-size:10px;opacity:.9}
th.n,td.n{text-align:right}
td{padding:6px;border-bottom:1px solid #26333d;vertical-align:top}
tbody tr[data-g]{cursor:pointer}
tbody tr[data-g]:hover td{background:var(--panel)}
tr.grouprow td{background:var(--panel2);color:var(--paint);font-weight:600;padding-top:9px}
td .code{font-weight:600}
td .nm{display:block;color:var(--mute);font-size:11.5px;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main.wide td .nm{max-width:230px}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:99px;border:1px solid var(--sign);color:var(--sign);white-space:nowrap}
.tdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:baseline}
.causes{color:var(--mute);font-size:11.5px;min-width:130px}
.sentence{font-size:19px;line-height:2.1;margin:2px 0 10px}
.sentence select,.sentence input{font-size:17px;background:none;border:0;border-bottom:2px solid var(--paint);border-radius:0;padding:0 2px;color:var(--paint);font-weight:600;max-width:none}
.sentence input{width:46px;text-align:center}
.sentence .dim{color:var(--mute)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.presets button{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12.5px}
.presets button:hover{border-color:var(--paint)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:6px 0;gap:8px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:4px 12px;font-size:12.5px}
.btn:hover{border-color:var(--mute)}
.btn.on{border-color:var(--paint);color:var(--paint)}
.dos h2{font-size:20px;margin-bottom:2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13px;margin:10px 0}
.facts dt{color:var(--mute)} .facts dd{margin:0}
.tl{display:grid;gap:8px}
.tl .yr{display:grid;grid-template-columns:44px 1fr;gap:8px}
.tl .yr>b{color:var(--paint)}
.tl .yr.none>b{color:var(--faint)}
.tl .p{font-size:12.5px;padding:2px 0;border-bottom:1px dotted #2c3943}
.tl .p span{color:var(--mute)}
.mini{display:flex;align-items:flex-end;gap:3px;height:60px}
.mini div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--faint)}
.mini i{display:block;width:100%;background:var(--crash);border-radius:2px 2px 0 0;min-height:1px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.list button{display:grid;grid-template-columns:1fr auto;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #26333d;padding:6px 2px}
.list button:hover{background:var(--panel)}
.list .nm{color:var(--mute);font-size:11.5px;grid-column:1}
.list .v{color:var(--mute);font-size:12px;grid-row:1/3;grid-column:2;align-self:center}
.empty{color:var(--mute);border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center}
/* map chrome */
.leaflet-container{background:#0f171e;font:inherit}
.mbtn{display:flex;gap:6px}
.mbtn button{background:rgba(30,41,50,.95);border:1px solid var(--line);border-radius:var(--r);padding:5px 11px;font-size:12.5px;color:var(--text)}
.mbtn button.on{border-color:var(--paint);color:var(--paint)}
.mapkey{background:rgba(23,32,40,.94);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:12px;color:var(--text);line-height:1.75;max-height:46vh;overflow:auto;min-width:180px}
.mapkey b{font-weight:600;display:block;margin-top:4px}
.mapkey b:first-child{margin-top:0}
.mapkey i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px}
.mapkey i.pt{width:9px;height:9px;border-radius:50%}
.mapkey .x{float:right;background:none;border:0;color:var(--mute);padding:0 2px}
.status{background:rgba(23,32,40,.9);border:1px solid var(--line);border-radius:var(--r);padding:2px 8px;font-size:11.5px;color:var(--mute)}
/* layer manager (QGIS-style) */
#lp{position:absolute;top:10px;right:10px;bottom:10px;width:340px;z-index:1200;background:rgba(30,41,50,.98);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#lp header{display:flex;align-items:center;justify-content:space-between;border:0;padding:10px 12px;border-bottom:1px solid var(--line)}
#lp header b{font-size:14px}
#lp .body{overflow:auto;padding:8px 10px;flex:1}
#lp .foot{border-top:1px solid var(--line);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lrow{border:1px solid var(--line);border-radius:var(--r);margin-bottom:6px;background:var(--panel)}
.lrow .hd{display:grid;grid-template-columns:auto 1fr auto auto auto;align-items:center;gap:6px;padding:5px 8px}
.lrow .hd label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:13px}
.lrow .hd .sw{width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
.lrow .hd button{background:none;border:1px solid transparent;border-radius:4px;color:var(--mute);width:24px;height:24px;padding:0}
.lrow .hd button:hover{border-color:var(--line);color:var(--text)}
.lrow .hd .oz{font-size:10.5px;color:var(--crash)}
.lrow .bd{padding:6px 10px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;border-top:1px solid var(--line)}
.lrow .bd .full{grid-column:1/-1}
.lrow .bd select,.lrow .bd input[type=number]{max-width:none;width:100%;padding:3px 6px;font-size:12.5px}
.lrow .bd input[type=range]{width:100%}
.lrow .bd input[type=color]{width:100%;height:26px;padding:0;border:1px solid var(--line);border-radius:4px;background:none}
.lrow .bd .sep{grid-column:1/-1;border-top:1px dashed var(--line);margin-top:2px;padding-top:6px;color:var(--text);font-size:12px;font-weight:600}
.lrow .bd .chk{display:flex;gap:6px;align-items:center;color:var(--text);font-size:12.5px}
.lrow .bd .link{background:none;border:0;color:var(--paint);font-size:11.5px;padding:0;text-align:left;text-decoration:underline}
.lbl{color:#fff;font-weight:500;white-space:nowrap;pointer-events:none;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;transform:translate(-50%,-50%)}
.leaflet-div-icon.lblicon{background:none;border:0}
.leaflet-tooltip.tt{background:var(--panel2);color:var(--text);border:1px solid var(--line);box-shadow:none;font:12.5px/1.45 "IBM Plex Sans Thai",sans-serif}
.leaflet-tooltip.tt:before{display:none}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--text)}
.leaflet-popup-content{font:12.5px/1.5 "IBM Plex Sans Thai",sans-serif;margin:10px 12px}
.leaflet-container a.leaflet-popup-close-button{color:var(--mute)}
.leaflet-control-scale-line{background:rgba(23,32,40,.85);color:var(--text);border-color:var(--mute)}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--asphalt);z-index:5000;color:var(--mute)}
@media (max-width:1100px){main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}aside.left,aside.right{border:0}.app{height:auto}main.wide{--rw:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="loading" id="loading">กำลังโหลดข้อมูล…</div>
<div class="app">
  <header>
    <div class="brand"><b>ระบบกระจาย งปม.สอป.</b><span>งบอำนวยความปลอดภัย ทช. ปี 2563–2569 · อุบัติเหตุ 2558–2569</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="overview">ภาพรวม</button>
      <button role="tab" data-tab="rank">จัดอันดับ</button>
      <button role="tab" data-tab="road">สายทาง</button>
      <button role="tab" data-tab="area">พื้นที่</button>
    </nav>
    <div class="proto">ต้นแบบ v3 · <a href="v2.html">v2</a> · <a href="index.html">หน้าเดิม</a></div>
  </header>
  <div class="fbar">
    <div class="fgrp"><label>ปีงบ</label><div class="years" id="years"></div></div>
    <div class="fgrp"><label>พื้นที่</label>
      <select id="f-grp" aria-label="กลุ่ม สทช."></select>
      <select id="f-bur" aria-label="สทช."></select>
      <select id="f-prov" aria-label="จังหวัด"></select>
    </div>
    <div class="fgrp"><label>สถานะงบ</label><div class="seg" id="status"></div></div>
    <div class="more"><button id="morebtn" aria-expanded="false">+ ตัวกรองอื่น</button>
      <div class="pop" id="morepop" hidden>
        <label>ขทช./หมวด ที่ดูแลสาย<select id="f-own"></select></label>
        <label>ประเภทงาน<select id="f-type"></select></label>
        <label>ยอดเงิน<select id="f-money"><option value="pbr">ตาม พ.ร.บ.</option><option value="trf">ตามที่โอนจัดสรร</option></select></label>
        <label>ปีอุบัติเหตุ<span style="display:flex;gap:6px;align-items:center"><select id="f-a0"></select>ถึง<select id="f-a1"></select></span></label>
        <label>นับปีอุบัติเหตุแบบ<select id="f-amode"><option value="cy">ปีปฏิทิน</option><option value="fy">ปีงบประมาณ</option></select></label>
      </div>
    </div>
    <div class="chips" id="chips"></div>
  </div>
  <main id="main">
    <aside class="left" id="left"></aside>
    <div class="mapwrap"><div id="map"></div><div id="lp" hidden></div></div>
    <aside class="right" id="right"></aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script src="data/adm.js"></script>
<script src="data/extra.js"></script>
<script src="data/causes.js"></script>
<script src="data/appdata.js"></script>
<script>
(()=>{
const D=window.DATA, C=window.CAUSES||{names:[],kinds:[],acc:[]};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>n==null?'–':Math.round(n).toLocaleString('th-TH');
const fmtM=b=>{if(!b)return '0';const m=b/1e6;return m.toLocaleString('th-TH',{maximumFractionDigits:m>=100?0:1})};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const YEARS=[63,64,65,66,67,68,69], AYEARS=[58,59,60,61,62,63,64,65,66,67,68,69];
const GROUPS={1:[4,11,12,14],2:[8,9,10,17],3:[5,6,7,15,16],4:[1,2,3,13,18]};
const B2G={};Object.entries(GROUPS).forEach(([g,bs])=>bs.forEach(b=>B2G[b]=+g));
const BNAME={};D.bureaus.forEach(b=>{const m=/สทช\.(\d+)/.exec(b);if(m)BNAME[+m[1]]=b});
const PCODE=Object.fromEntries(Object.entries(D.adm.p).map(([c,n])=>[n,c]));
const bnoOf=s=>+((/สทช\.(\d+)/.exec(s||'')||[])[1]||0);

/* ---------- road model: one road = one road code (segments crossing provinces are merged) ---------- */
const ROADS=new Map(), SEG2R={};
D.segs.forEach(s=>{const [key,g,code,name,prov,bur,len,pcu,geom,oi,mid]=s;const pn=g.split('|')[1]||prov;
  let r=ROADS.get(code);
  if(!r){r={g:code,code,name,provs:new Set(),pkm:{},bkm:{},owners:new Set(),km:0,pcu:null,segs:[],mid,proj:[],acc:[],ever:false};ROADS.set(code,r)}
  r.provs.add(pn);r.pkm[pn]=(r.pkm[pn]||0)+(len||0);const b=bnoOf(bur);r.bkm[b]=(r.bkm[b]||0)+(len||0);

function quadOf(rs){const nf=NEED[S.need].f,nv=rs.map(nf).filter(v=>v!=null&&v>0).sort((a,b)=>a-b),bv=rs.map(r=>M.get(r).bud).filter(v=>v>0).sort((a,b)=>a-b);

function scatter(rs,nt,bt){const W=400,H=230,pl=34,pb=22,nf=NEED[S.need].f;const pts=rs.filter(r=>nf(r)!=null&&nf(r)>0);if(!pts.length)return '';
  const nx=pts.map(nf),bx=pts.map(r=>M.get(r).bud).filter(v=>v>0);const lx=[Math.log10(Math.min(...nx)),Math.log10(Math.max(...nx))],ly=bx.length?[Math.log10(Math.min(...bx)),Math.log10(Math.max(...bx))]:[0,1];

  $('#left').innerHTML=kpis()+`<h3>เทียบพื้นที่</h3><div class="pop" style="position:static;width:auto;box-shadow:none;background:var(--panel)"><label>ระดับพื้นที่<select id="ar-lv">${Object.entries(LV).map(([k,t])=>`<option value="${k}"${k===S.ar.lv?' selected':''}>${t}</option>`).join('')}</select></label>
   <label>ระบายสีตาม<select id="ar-m">${Object.entries(AM).map(([k,t])=>`<option value="${k}"${k===m?' selected':''}>${t}</option>`).join('')}</select></label></div>
   <p class="note">${S.ar.lv==='grp'||S.ar.lv==='bur'?'แผนที่ระบายสีรายจังหวัดตาม สทช. ที่ดูแลสายส่วนใหญ่ในจังหวัดนั้น':'คลิกพื้นที่บนแผนที่หรือในตารางเพื่อกรอง'}</p>`+tierPanel();bindLeft();
  $('#ar-lv').onchange=e=>{S.ar.lv=e.target.value;update()};$('#ar-m').onchange=e=>{S.ar.m=e.target.value;delete S.sort.ar;update()};
  const mp=k=>{const f=S.ar.lv==='ect'&&AF.e&&AF.e.features.find(f=>f.properties.k===k);return f&&f.properties.mp||''};
  const cols=[{k:'name',t:'พื้นที่',v:o=>o.name,f:o=>`<span class="tdot" style="background:${col(o[m])}"></span>${esc(o.name)}${mp(o.k)?`<span class="nm">${esc(mp(o.k))}</span>`:''}`},
    {k:m,t:AM[m],n:1,v:o=>o[m],f:fmtV},...(m!=='bud'?[{k:'bud',t:'งบ (ลบ.)',n:1,v:o=>o.bud,f:o=>fmtM(o.bud)}]:[]),
    ...(m!=='unf'?[{k:'unf',t:'ยังไม่ได้งบ',n:1,v:o=>o.unf,f:o=>`${fmtN(o.unf)}<span class="nm" style="text-align:right">จาก ${fmtN(o.n)} สาย</span>`}]:[{k:'n',t:'สายทั้งหมด',n:1,v:o=>o.n,f:o=>fmtN(o.n)}]),
    ...(m!=='acc'?[{k:'acc',t:'อุบัติเหตุ',n:1,v:o=>o.acc,f:o=>fmtN(o.acc)}]:[])];
  const sorted=sortRows('ar',rows,cols,{k:m,d:'desc'});
  $('#right').innerHTML=`<h2>${LV[S.ar.lv]} · ${fmtN(rows.length)} พื้นที่</h2><div class="toolbar"><span class="sub">คลิกหัวตารางเพื่อเรียง · คลิกแถวเพื่อกรอง</span><button class="btn" id="ar-csv">ดาวน์โหลด CSV</button></div>
   <table>${thead('ar',cols,{k:m,d:'desc'})}<tbody>${sorted.map(o=>`<tr data-ak="${esc(o.k)}" style="cursor:pointer">${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(o)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  $('#right').querySelectorAll('tr[data-ak]').forEach(tr=>tr.onclick=()=>pickArea(tr.dataset.ak));
  $('#ar-csv').onclick=()=>{const t='﻿'+[['พื้นที่','สส.','งบ(บาท)','อุบัติเหตุ','เสียชีวิต','สายทั้งหมด','ยังไม่เคยได้งบ','งบต่อกม.(บาท)'],...sorted.map(o=>[o.name,mp(o.k),Math.round(o.bud),o.acc,o.dead,o.n,o.unf,Math.round(o.budkm)])].map(l=>l.map(v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':v).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='เทียบพื้นที่.csv';a.click()};
  shadeLayer.clearLayers();const by=new Map(rows.map(o=>[String(o.k),o]));let fc,kf;
  if(S.ar.lv==='ect'&&AF.e){fc=AF.e;kf=f=>f.properties.k}else if(S.ar.lv==='prov'){fc=AF.p;kf=f=>f.properties.c}
  else{const maj={};RL.forEach(r=>{if(!r.pc)return;const c=maj[r.pc]=maj[r.pc]||{};c[r.bno]=(c[r.bno]||0)+1});const pb={};Object.entries(maj).forEach(([p,c])=>pb[p]=+Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]);
    fc=AF.p;kf=f=>S.ar.lv==='bur'?String(pb[f.properties.c]||''):String(B2G[pb[f.properties.c]]||'')}
  L.geoJSON(fc,{renderer:shadeR,style:f=>{const o=by.get(String(kf(f)));return {color:'#0f171e',weight:.6,fillColor:o?col(o[m]):'#1b2630',fillOpacity:o?.75:.25}},
    onEachFeature:(f,l)=>{const o=by.get(String(kf(f)));l.bindTooltip(()=>o?`<b>${esc(o.name)}</b><br>${esc(AM[m])}: ${fmtV(o)}<br>สาย ${fmtN(o.n)} · ยังไม่ได้งบ ${fmtN(o.unf)} · อุบัติเหตุ ${fmtN(o.acc)}${S.ar.lv==='ect'&&f.properties.mp?'<br>'+esc(f.properties.mp):''}`:esc(f.properties.n||''),{sticky:true,className:'tt'});
      l.on('click',e=>{L.DomEvent.stop(e);if(o)pickArea(String(o.k))})}}).addTo(shadeLayer);
  shadeLayer.addTo(map);
  keyExtra=`<b>${esc(AM[m])}</b><div style="display:flex;height:8px;border-radius:2px;overflow:hidden;width:160px;margin:4px 0 2px">${ARAMP[m].map(c=>`<i style="flex:1;height:8px;margin:0;background:${c}"></i>`).join('')}</div><div class="sub" style="display:flex;justify-content:space-between;width:160px"><span>น้อย</span><span>มาก</span></div>`;renderKey()}
function pickArea(k){const lv=S.ar.lv;if(lv==='grp'){S.grp=k;S.bur='';S.prov=''}else if(lv==='bur'){S.bur=k;S.grp=String(B2G[k]||'');S.prov=''}else if(lv==='prov')S.prov=k;
  else{const f=AF.e.features.find(f=>f.properties.k===k);if(f){map.fitBounds(L.geoJSON(f).getBounds(),{padding:[30,30]});highlight(RL.filter(r=>ectOfRoad(r)===k&&SCOPE.includes(r)))}return}
  S.own='';update(true)}

/* ---------- update ---------- */
function renderTab(){keyExtra='';map.removeLayer(shadeLayer);
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===S.tab));$('#main').classList.toggle('wide',S.tab==='rank');
  ({overview:tabOverview,rank:tabRank,road:tabRoad,area:tabArea})[S.tab]();renderKey()}
let lastAreaKey='',lastTab=S.tab;
function update(refit){if(S.tab!==lastTab&&lastTab==='road'){refit=true;lastAreaKey=''}lastTab=S.tab;
  compute();renderFilters();drawRoads();drawAcc();drawProj();applyVis();highlight([]);renderTab();setTimeout(()=>map.invalidateSize(),0);
  const ak=[S.grp,S.bur,S.prov,S.own,S.status].join('|');if(refit&&ak!==lastAreaKey&&S.tab!=='road')fitScope();lastAreaKey=ak;save()}
applyOrder();applyBase();['pro','amp','tam','ect'].forEach(drawPoly);status();
update(true);
document.getElementById('loading').remove();
})();
</script>
</body>
</html>
